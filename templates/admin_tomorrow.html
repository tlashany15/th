{% extends "app_base.html" %}
{% block content %}
<section class="hero-admin">
  <div class="hero-mesh"></div>
  <div class="hero-row">
    <div>
      <span class="hero-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25"/></svg>
        تحضير الغد
      </span>
      <h1 class="hero-h1">قائمة عمال {{ tomorrow }}</h1>
      <p class="hero-sub">اختر الأسماء وانشرها في الدردشة الجماعية.</p>
    </div>
  </div>
</section>

<div class="card">
  <form method="post" action="{{ url_for('admin_announce_tomorrow') }}">
    <input type="hidden" name="day" value="{{ tomorrow }}">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div class="sec-h-t">اختر العمال</div>
      <button type="button" class="btn btn-ghost btn-sm" id="selAll">تحديد الكل</button>
    </div>
    <div class="tomorrow-grid">
      {% for w in all_workers %}
      <label class="tom-chk">
        <input type="checkbox" name="user_ids" value="{{ w.id }}">
        <span class="tom-name">{{ w.full_name }}</span>
      </label>
      {% else %}
      <div class="empty"><div>لا يوجد عمال مسجلين</div></div>
      {% endfor %}
    </div>
    <button class="btn btn-primary btn-lg" type="submit" style="margin-top:12px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:18px;height:18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
      نشر القائمة في الجروب
    </button>
  </form>
  <div style="margin-top:10px;">
    <a class="btn btn-ghost" href="{{ url_for('admin_panel') }}">← رجوع للوحة</a>
  </div>
</div>

<script>
(function(){
  var b = document.getElementById('selAll');
  if (!b) return;
  b.addEventListener('click', function(){
    var boxes = document.querySelectorAll('.tom-chk input[type=checkbox]');
    var allOn = Array.prototype.every.call(boxes, function(x){ return x.checked; });
    boxes.forEach(function(x){ x.checked = !allOn; });
  });
})();
</script>
{% endblock %}
