{% extends "base.html" %}
{% block body %}
<div class="splash-v3">
  <div class="splash-v3-bg" aria-hidden="true">
    <span class="sv3-orb sv3-orb-a"></span>
    <span class="sv3-orb sv3-orb-b"></span>
  </div>

  <div class="splash-v3-center">
    <div class="splash-v3-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="sv3grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffd27a"/><stop offset=".55" stop-color="#f5a623"/><stop offset="1" stop-color="#ef4444"/>
          </linearGradient>
        </defs>
        <path d="M12 2.2l8.2 3v6.5c0 4.7-3.4 8.9-8.2 10.1-4.8-1.2-8.2-5.4-8.2-10.1V5.2l8.2-3z" fill="url(#sv3grad)"/>
        <path d="M8.6 12.4l2.6 2.6L16 9.4" stroke="#1a0800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="splash-v3-name">فريق التحصين</div>
    <div class="splash-v3-loader"><span></span></div>
  </div>
</div>

<script>
  (function(){
    try { localStorage.setItem('splash_seen', String(Date.now())); } catch(e){}
    setTimeout(function(){
      window.location.replace("{{ url_for('login') }}");
    }, 3000);
  })();
</script>
{% endblock %}
