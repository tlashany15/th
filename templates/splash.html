{% extends "base.html" %}
{% block head_extra %}
  <!-- تحويل احتياطي بدون جافاسكربت — مهم جدًا داخل WebView -->
  <meta http-equiv="refresh" content="2;url={{ next_url }}">
{% endblock %}
{% block body %}
<div class="splash-v3">
  <div class="splash-v3-bg" aria-hidden="true">
    <span class="sv3-orb sv3-orb-a"></span>
    <span class="sv3-orb sv3-orb-b"></span>
  </div>

  <div class="splash-v3-center">
    <div class="splash-v3-logo">
      <!-- شعار: درع التحصين -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="spShield" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7dc86"/>
            <stop offset=".52" stop-color="#e3b445"/>
            <stop offset="1" stop-color="#c3871a"/>
          </linearGradient>
        </defs>
        <path d="M32 5 L54.5 13.2 V31c0 13.6-9.2 23.1-22.5 28.4C18.7 54.1 9.5 44.6 9.5 31V13.2Z" fill="url(#spShield)"/>
        <path d="M32 11.6 L48.4 17.5 V31c0 10.2-6.7 17.6-16.4 21.8C22.3 48.6 15.6 41.2 15.6 31V17.5Z" fill="#0f1a24" opacity=".14"/>
        <path d="M21.8 32.6 L29.2 40 L43 25.4" stroke="#12202b" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="splash-v3-name">فريق التحصين</div>
    <div class="splash-v3-loader"><span></span></div>
    <!-- رابط ظاهر لو التحويل التلقائي اتمنع في الـ WebView -->
    <a class="splash-v3-manual" id="splashManual" href="{{ next_url }}">اضغط للدخول</a>
  </div>
</div>

<script>
  (function(){
    var target = {{ next_url|tojson }};
    var done = false;
    function go(){
      if (done) return;
      done = true;
      try { window.location.replace(target); }
      catch (e) { window.location.href = target; }
    }
    // لو المستخدم شاف السبلاش قبل كده في نفس الجلسة — تحويل فوري
    var seen = false;
    try { seen = sessionStorage.getItem('seenSplash') === '1'; sessionStorage.setItem('seenSplash','1'); } catch(e){}
    setTimeout(go, seen ? 0 : 450);
    setTimeout(function(){
      var m = document.getElementById('splashManual');
      if (m) m.classList.add('is-show');
    }, 2600);
  })();
</script>
<style>
  .splash-v3-manual{
    margin-top:6px; opacity:0; pointer-events:none;
    font-size:13px; font-weight:800; color:#f2d675; text-decoration:none;
    padding:9px 18px; border-radius:99px;
    border:1px solid rgba(242,214,117,.35); background:rgba(242,214,117,.10);
    transition:opacity .25s ease;
  }
  .splash-v3-manual.is-show{ opacity:1; pointer-events:auto; }
</style>
{% endblock %}
