{% extends "base.html" %}
{% block body %}
<div class="splash">
  <!-- خلفية متحركة -->
  <div class="splash-bg">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <div class="splash-grid"></div>
  </div>

  <div class="splash-inner">
    <!-- اللوجو -->
    <div class="splash-logo">
      <div class="splash-logo-glow"></div>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="splashShield" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ffd27a"/><stop offset=".6" stop-color="#f5a623"/><stop offset="1" stop-color="#ef4444"/>
          </linearGradient>
        </defs>
        <path d="M12 2.2l8.2 3v6.5c0 4.7-3.4 8.9-8.2 10.1-4.8-1.2-8.2-5.4-8.2-10.1V5.2l8.2-3z" fill="url(#splashShield)"/>
        <path d="M8.6 12.4l2.6 2.6L16 9.4" stroke="#1a0800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="splash-title">فريق تحصين الكتاكيت</h1>
    <p class="splash-tag">إدارة يومك بأبسط وأسرع طريقة 🐤</p>

    <!-- مزايا سريعة -->
    <div class="splash-features">
      <div class="sf-item" style="--d:.15s;">
        <div class="sf-ico sf-ico-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
        </div>
        <div>
          <div class="sf-t">تسجيل حضور فوري</div>
          <div class="sf-s">بضغطة واحدة كل صباح</div>
        </div>
      </div>
      <div class="sf-item" style="--d:.28s;">
        <div class="sf-ico sf-ico-gold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.5l7.5 7.5 10.5-15"/></svg>
        </div>
        <div>
          <div class="sf-t">متابعة الإجمالي لحظياً</div>
          <div class="sf-s">شوف شغل الفريق كل اليوم</div>
        </div>
      </div>
      <div class="sf-item" style="--d:.4s;">
        <div class="sf-ico sf-ico-green">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18h18M7 14l4-4 4 4 5-6"/></svg>
        </div>
        <div>
          <div class="sf-t">سجل كامل لكل يوم</div>
          <div class="sf-s">مقسوم على فترات نصف الشهر</div>
        </div>
      </div>
    </div>

    <a href="{{ url_for('login') }}" class="splash-cta">
      <span>ابدأ الآن</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    </a>
    <a href="{{ url_for('login') }}" class="splash-skip">تخطّي</a>
  </div>
</div>

<script>
  // اخفي السبلاش بعد أول دخول لمدة 7 أيام
  try {
    localStorage.setItem('splash_seen', String(Date.now()));
  } catch(e){}
</script>
{% endblock %}
