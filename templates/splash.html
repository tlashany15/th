{% extends "base.html" %}
{% block body %}
<div class="splash-simple">
  <div class="splash-bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <div class="ssp-logo">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="splashShield" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ffd27a"/><stop offset=".6" stop-color="#f5a623"/><stop offset="1" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <path d="M12 2.2l8.2 3v6.5c0 4.7-3.4 8.9-8.2 10.1-4.8-1.2-8.2-5.4-8.2-10.1V5.2l8.2-3z" fill="url(#splashShield)"/>
      <path d="M8.6 12.4l2.6 2.6L16 9.4" stroke="#1a0800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1 class="ssp-title">فريق تحصين الكتاكيت</h1>
  <p class="ssp-tag">إدارة يومك بأبسط وأسرع طريقة 🐤</p>

  <div class="ssp-divider"></div>

  <div class="ssp-points">
    <div class="ssp-point" style="--d:.45s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
      تسجيل حضور بضغطة واحدة كل صباح
    </div>
    <div class="ssp-point" style="--d:.55s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
      متابعة إجمالي التحصين لحظياً
    </div>
    <div class="ssp-point" style="--d:.65s">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>
      سجل كامل مقسوم على كل نصف شهر
    </div>
  </div>

  <a href="{{ url_for('login') }}" class="ssp-cta">
    <span>ابدأ الآن</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
  </a>
</div>
{% endblock %}
