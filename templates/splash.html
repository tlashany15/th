{% extends "base.html" %}
{% block body %}
<div class="splash-v3">
  <div class="splash-v3-bg" aria-hidden="true">
    <span class="sv3-orb sv3-orb-a"></span>
    <span class="sv3-orb sv3-orb-b"></span>
  </div>

  <div class="splash-v3-center">
    <div class="splash-v3-logo">
      <!-- شعار: كتكوت -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <radialGradient id="chBody" cx="45%" cy="42%" r="65%">
            <stop offset="0" stop-color="#fff2b0"/>
            <stop offset=".55" stop-color="#ffcf3d"/>
            <stop offset="1" stop-color="#f39a0e"/>
          </radialGradient>
          <linearGradient id="chBeak" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e05a10"/>
          </linearGradient>
        </defs>
        <!-- feet -->
        <g stroke="#e05a10" stroke-width="2.4" stroke-linecap="round">
          <path d="M25 55 L22 61 M28 55 L28 61 M31 55 L34 61"/>
          <path d="M36 55 L33 61 M39 55 L39 61 M42 55 L45 61"/>
        </g>
        <!-- body -->
        <ellipse cx="32" cy="39" rx="18" ry="16.5" fill="url(#chBody)"/>
        <!-- head -->
        <circle cx="32" cy="23" r="13" fill="url(#chBody)"/>
        <!-- tuft -->
        <path d="M29 9 Q31 5 33 9 M32 7 Q34 4 36 8 M35 9 Q37 6 38 10" stroke="#e88b0a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <!-- wing -->
        <path d="M20 37 Q26 30 27 43 Q22 45 20 41 Z" fill="#ef9a0d" opacity=".55"/>
        <!-- eye -->
        <circle cx="36" cy="20.5" r="2.6" fill="#1a0f00"/>
        <circle cx="36.9" cy="19.7" r="1" fill="#fff"/>
        <!-- beak -->
        <path d="M40 24 L48 26 L40 28 Z" fill="url(#chBeak)"/>
        <!-- cheek blush -->
        <circle cx="27" cy="26" r="1.6" fill="#ffb0b0" opacity=".55"/>
      </svg>
    </div>
    <div class="splash-v3-name">فريق التحصين</div>
    <div class="splash-v3-loader"><span></span></div>
  </div>
</div>

<script>
  (function(){
    setTimeout(function(){
      window.location.replace({{ next_url|tojson }});
    }, 900);
  })();
</script>
{% endblock %}
