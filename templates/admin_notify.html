{% extends "app_base.html" %}
{% block content %}
<div class="notify-page">
  <h2 class="notify-title">إرسال إشعار</h2>
  <form method="post" action="{{ url_for('admin_notify') }}" class="notify-form">
    <label class="notify-field">
      <span>العنوان</span>
      <input type="text" name="title" required maxlength="200" placeholder="مثلاً: تذكير بموعد الحضور">
    </label>
    <label class="notify-field">
      <span>النص (اختياري)</span>
      <textarea name="body" rows="3" maxlength="1000" placeholder="تفاصيل الإشعار…"></textarea>
    </label>
    <label class="notify-field">
      <span>رابط (اختياري)</span>
      <input type="text" name="url" placeholder="/group أو أي مسار داخلي">
    </label>

    <div class="notify-field">
      <span>المستهدفون</span>
      <div class="notify-target">
        <label class="notify-radio">
          <input type="radio" name="target" value="all" checked onchange="document.getElementById('userPicker').style.display='none'">
          <span>كل المستخدمين</span>
        </label>
        <label class="notify-radio">
          <input type="radio" name="target" value="pick" onchange="document.getElementById('userPicker').style.display='block'">
          <span>عمال محددين</span>
        </label>
      </div>
    </div>

    <div id="userPicker" class="notify-picker" style="display:none">
      <div class="notify-picker-hint">اختر واحد أو أكتر:</div>
      <div class="notify-users">
        {% for u in users %}
          <label class="notify-chip">
            <input type="checkbox" name="user_ids" value="{{ u.id }}">
            <span>{{ u.full_name }}{% if u.role == 'admin' %} ★{% endif %}</span>
          </label>
        {% endfor %}
      </div>
    </div>

    <button type="submit" class="notify-submit">إرسال الإشعار</button>
  </form>

  {% if is_real_super_admin %}
  <form method="post" action="{{ url_for('admin_open_idara') }}" class="notify-idara"
        onsubmit="var f=this; if(f.dataset.ok==='1') return true; event.preventDefault(); (window.appConfirm?window.appConfirm('هتفتح حساب الإدارة مؤقتًا.',{title:'فتح حساب الإدارة؟',okText:'فتح'}):Promise.resolve(confirm('فتح حساب الإدارة؟'))).then(function(ok){ if(ok){ f.dataset.ok='1'; f.submit(); } }); return false;">
    <button type="submit" class="notify-idara-btn">
      <span class="notify-idara-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13a8 8 0 0 1 16 0"/><rect x="2.5" y="13" width="4.5" height="7" rx="2"/><rect x="17" y="13" width="4.5" height="7" rx="2"/><path d="M19 20v.5a2.5 2.5 0 0 1-2.5 2.5H13"/></svg>
      </span>
      <span>فتح حساب الإدارة</span>
      <span class="verified-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>
    </button>
  </form>
  {% endif %}
</div>
{% endblock %}
