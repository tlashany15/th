{% extends "app_base.html" %}
{% block content %}

<!-- ============ قسم «مسلم» — ترتيب مرتّب: البسملة ← المواقيت ← أيقونات صغيرة ============ -->
<div class="mus-page">
  <div class="mus-bg" aria-hidden="true"></div>

  <!-- 1) البسملة + دعاء اليوم في كارت واحد صغير -->
  <section class="mus-basmala-card ms20-top" aria-label="بسم الله الرحمن الرحيم">
    <div class="mus-basmala">﷽</div>
    <p class="ms20-top-dua">اللَّهُمَّ أعِنّي على ذِكرِكَ وشُكرِكَ وحُسنِ عبادتِك</p>
  </section>

  <!-- 2) مواقيت الصلاة والأذان أول حاجة بعد البسملة -->
  <section id="islamicWidget" class="isl-wrap" aria-label="مواقيت الصلاة">
    <div class="isl-skel"></div>
  </section>

  <!-- 3) أيقونات صغيرة جنب بعضها (المصحف / التلاوة / الأذكار / الأدعية …) -->
  <nav class="ms20-tiles" aria-label="أقسام سريعة">
    <a class="ms20-tile" href="{{ url_for('mushaf_page') }}" id="musMushafLink">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v17H5.5A2.5 2.5 0 0 0 3 22.5z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v17h5.5a2.5 2.5 0 0 1 2.5 2.5z"/><path d="M12 3v17"/></svg>
      </span>
      <span class="ms20-tile-t">المصحف</span>
      <span class="ms20-tile-b" id="musResume" hidden></span>
    </a>

    <a class="ms20-tile is-audio" href="{{ url_for('recite_page') }}">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="2.5" y="13" width="4.5" height="7" rx="2"/><rect x="17" y="13" width="4.5" height="7" rx="2"/><path d="M9.5 21h5"/></svg>
      </span>
      <span class="ms20-tile-t">قراءة بالصوت</span>
    </a>

    <button type="button" class="ms20-tile is-blue" data-sheet="azkar-m">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </span>
      <span class="ms20-tile-t">أذكار الصباح</span>
    </button>

    <button type="button" class="ms20-tile is-violet" data-sheet="azkar-e">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </span>
      <span class="ms20-tile-t">أذكار المساء</span>
    </button>

    <button type="button" class="ms20-tile" data-sheet="duas">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21c-1.5-2.4-2-4.4-2-6.5 0-2 .7-3.4 1.4-5.2.5-1.3.6-2.3.4-3.3"/><path d="M16 21c1.5-2.4 2-4.4 2-6.5 0-2-.7-3.4-1.4-5.2-.5-1.3-.6-2.3-.4-3.3"/><path d="M12 21V9"/></svg>
      </span>
      <span class="ms20-tile-t">أدعية</span>
    </button>

    <button type="button" class="ms20-tile is-rose" data-sheet="ruqya">
      <span class="ms20-tile-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5C7 17.5 4 14.2 4 10.4A4.4 4.4 0 0 1 12 7.6a4.4 4.4 0 0 1 8 2.8c0 3.8-3 7.1-8 10.1z"/></svg>
      </span>
      <span class="ms20-tile-t">الرقية</span>
    </button>

  </nav>
</div>

{% endblock %}
