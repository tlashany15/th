{% extends "base.html" %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🐥</div>
    <h1 class="auth-title">إنشاء حساب</h1>
    <p class="auth-sub">انضم لفريق التحصين</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{% if cat == 'error' %}✕{% else %}✓{% endif %} {{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <div class="card mb-0">
      <form method="post">
        <div class="field">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg>
            الاسم الكامل
          </label>
          <input name="full_name" required placeholder="مثال: محمد أحمد">
        </div>
        <div class="field">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            اسم المستخدم
          </label>
          <input name="username" required placeholder="مثال: mo_ahmed">
        </div>
        <div class="field">
          <label>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
            كلمة السر
          </label>
          <input name="password" type="password" required placeholder="••••••••">
        </div>
        <button class="btn btn-primary" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z"/></svg>
          إنشاء الحساب
        </button>
      </form>
    </div>
    <p class="auth-footer">لديك حساب؟ <a href="{{ url_for('login') }}">سجّل دخولك</a></p>
  </div>
</div>
{% endblock %}
