<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تم إيقاف التطبيق من المطور</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#fde68a33,transparent 60%),linear-gradient(180deg,#0b0d12,#14161d);color:#f4f4f6}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{max-width:460px;width:100%;background:rgba(17,24,39,.85);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:28px 22px;text-align:center;backdrop-filter:blur(14px);box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
  .ic{width:74px;height:74px;border-radius:20px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#2f7dff,#b45309);color:#fff;box-shadow:0 18px 34px -14px rgba(47,125,255,.6)}
  .ic svg{width:38px;height:38px}
  h1{margin:6px 0 8px;font-size:22px;font-weight:900;color:#fff}
  p{margin:0;color:#cbd5e1;line-height:1.7;font-size:14.5px}
  .hint{margin-top:18px;font-size:12.5px;color:#a1a4b2}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2f7dff;margin-inline-end:6px;box-shadow:0 0 0 0 rgba(47,125,255,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,125,255,.6)}70%{box-shadow:0 0 0 14px rgba(47,125,255,0)}100%{box-shadow:0 0 0 0 rgba(47,125,255,0)}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="ic" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5"/>
        </svg>
      </div>
      <h1>تم إيقاف التطبيق من المطور</h1>
      <p>تم إيقاف التطبيق من المطور مؤقتًا. من فضلك انتظر لحد ما يرجع الشغل.</p>
      <div class="hint"><span class="dot"></span> في انتظار إعادة التشغيل…</div>
    </div>
  </div>
  <script>setTimeout(()=>location.reload(), 30000);</script>
</body>
</html>
