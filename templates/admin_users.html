{% extends "app_base.html" %}
{% block content %}

<div class="card">
  <div class="section-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z"/></svg>
    إضافة مستخدم جديد
  </div>
  <form method="post">
    <input type="hidden" name="action" value="create">
    <div class="field">
      <label>الاسم الكامل</label>
      <input name="full_name" required placeholder="مثال: محمد أحمد">
    </div>
    <div class="field">
      <label>اسم المستخدم</label>
      <input name="username" required placeholder="مثال: mo_ahmed">
    </div>
    <div class="field">
      <label>كلمة السر</label>
      <input name="password" type="password" required placeholder="••••••••">
    </div>
    <div class="field">
      <label>الدور</label>
      <select name="role">
        <option value="worker">عامل</option>
        <option value="admin">مسؤول</option>
      </select>
    </div>
    <button class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      إضافة المستخدم
    </button>
  </form>
</div>

<div class="card">
  <div class="section-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:14px;height:14px"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
    قائمة المستخدمين
  </div>
  {% for u in users %}
  <div class="worker-card">
    <div class="between">
      <div>
        <div class="worker-name">
          {{ u.full_name }}
          {% if u.role == 'admin' %}<span class="badge badge-gold" style="margin-right:6px;">مسؤول</span>{% else %}<span class="badge badge-muted" style="margin-right:6px;">عامل</span>{% endif %}
        </div>
        <div class="worker-meta">@{{ u.username }}</div>
      </div>
      {% if u.id != current_user.id %}
      <form method="post" onsubmit="return confirm('حذف المستخدم؟')">
        <input type="hidden" name="action" value="delete">
        <input type="hidden" name="user_id" value="{{ u.id }}">
        <button class="btn btn-danger btn-sm">حذف</button>
      </form>
      {% endif %}
    </div>
    <form method="post" class="row" style="margin-top:10px;">
      <input type="hidden" name="action" value="reset_pw">
      <input type="hidden" name="user_id" value="{{ u.id }}">
      <input name="password" type="text" placeholder="كلمة سر جديدة"
        style="flex:1;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border);font-size:14px;font-family:inherit;outline:none;">
      <button class="btn btn-ghost btn-sm">تغيير السر</button>
    </form>
  </div>
  {% endfor %}
</div>

{% endblock %}
