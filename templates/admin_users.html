{% extends "app_base.html" %}
{% block content %}
<div class="card">
  <div class="between">
    <h2 style="margin:0;">المستخدمون</h2>
    <a href="{{ url_for('admin_panel') }}" class="btn btn-ghost btn-sm">→ لوحة المسؤول</a>
  </div>
</div>

<div class="card">
  <h2>إضافة مستخدم</h2>
  <form method="post">
    <input type="hidden" name="action" value="create">
    <div class="field"><label>الاسم الكامل</label><input name="full_name" required></div>
    <div class="field"><label>اسم المستخدم</label><input name="username" required></div>
    <div class="field"><label>كلمة السر</label><input name="password" type="password" required></div>
    <div class="field"><label>الدور</label>
      <select name="role"><option value="worker">عامل</option><option value="admin">مسؤول</option></select>
    </div>
    <button class="btn btn-primary">إضافة</button>
  </form>
</div>

<div class="card">
  <h2>القائمة</h2>
  <div class="list">
    {% for u in users %}
      <div class="item" style="flex-direction:column; align-items:stretch; gap:10px;">
        <div class="between">
          <div>
            <div style="font-weight:700;">{{ u.full_name }}
              {% if u.role=='admin' %}<span class="badge admin">مسؤول</span>{% endif %}
            </div>
            <div class="muted" style="font-size:12px;">@{{ u.username }}</div>
          </div>
          {% if u.id != current_user.id %}
          <form method="post" onsubmit="return confirm('حذف المستخدم؟')">
            <input type="hidden" name="action" value="delete">
            <input type="hidden" name="user_id" value="{{ u.id }}">
            <button class="btn btn-danger btn-sm">حذف</button>
          </form>
          {% endif %}
        </div>
        <form method="post" class="row">
          <input type="hidden" name="action" value="reset_pw">
          <input type="hidden" name="user_id" value="{{ u.id }}">
          <input name="password" type="text" placeholder="كلمة سر جديدة" style="flex:1; padding:10px; border-radius:10px; background:#0e1730; color:var(--text); border:1px solid var(--border);">
          <button class="btn btn-ghost btn-sm">تغيير السر</button>
        </form>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
