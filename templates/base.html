<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e1621">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{% block title %}فريق تحصين الكتاكيت{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style-v2.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes.css') }}">
  <script src="{{ url_for('static', filename='themes.js') }}" defer></script>

</head>
<body class="no-copy" oncopy="return false" oncut="return false" oncontextmenu="return false" ondragstart="return false" onselectstart="return false">
{% block body %}{% endblock %}
<script>
  (function(){
    var stop = function(e){ e.preventDefault(); return false; };
    document.addEventListener('contextmenu', stop);
    document.addEventListener('copy', stop);
    document.addEventListener('cut', stop);
    document.addEventListener('dragstart', stop);
    document.addEventListener('selectstart', function(e){
      var t = e.target;
      var tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
      if (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable)) return true;
      e.preventDefault(); return false;
    });
    document.addEventListener('keydown', function(e){
      var k = (e.key || '').toLowerCase();
      var t = e.target;
      var tag = (t && t.tagName) ? t.tagName.toLowerCase() : '';
      var editable = (tag === 'input' || tag === 'textarea' || (t && t.isContentEditable));
      if (!editable && (e.ctrlKey || e.metaKey) && (k === 'c' || k === 'x' || k === 'a' || k === 's' || k === 'p' || k === 'u')) {
        e.preventDefault(); return false;
      }
    });

    // ====== Real-time presence ======
    if (document.body && !document.body.dataset.noPing) {
      var doPing = function(){
        try { fetch('/me/ping', { method:'POST', headers:{'X-Requested-With':'fetch'}, keepalive: true }); } catch(e){}
      };
      // فوري + كل 15 ثانية
      doPing();
      setInterval(function(){
        if (!document.hidden) doPing();
      }, 15000);
      // لما التبويب يرجع
      document.addEventListener('visibilitychange', function(){
        if (!document.hidden) doPing();
      });
      window.addEventListener('focus', doPing);
      // قبل إغلاق الصفحة
      window.addEventListener('pagehide', doPing);
    }
  })();
</script>

<!-- ===== Global Popups (appAlert / appConfirm) ===== -->
<div class="app-toast-wrap" id="appToastWrap" aria-live="polite"></div>
<div class="app-modal-root" id="appModalRoot" aria-hidden="true">
  <div class="app-modal-back" data-app-close></div>
  <div class="app-modal-card" role="dialog" aria-modal="true">
    <div class="app-modal-ic" id="appModalIc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <div class="app-modal-title" id="appModalTitle">تأكيد</div>
    <div class="app-modal-sub" id="appModalSub">هل أنت متأكد؟</div>
    <div class="app-modal-actions">
      <button class="btn btn-ghost" data-app-close id="appModalCancel">إلغاء</button>
      <button class="btn btn-primary" id="appModalOk">تأكيد</button>
    </div>
  </div>
</div>
<script>
(function(){
  var wrap = document.getElementById('appToastWrap');
  var modal = document.getElementById('appModalRoot');
  var modalIc = document.getElementById('appModalIc');
  var modalTitle = document.getElementById('appModalTitle');
  var modalSub = document.getElementById('appModalSub');
  var modalOk = document.getElementById('appModalOk');
  var modalCancel = document.getElementById('appModalCancel');
  var currentResolve = null;

  var ICONS = {
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z"/></svg>',
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
  };

  window.appAlert = function(text, kind){
    kind = kind || 'info';
    var t = document.createElement('div');
    t.className = 'app-toast is-' + kind;
    t.innerHTML = '<span class="at-ic">' + (ICONS[kind]||ICONS.info) + '</span><span>' + String(text) + '</span>';
    wrap.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('is-show'); });
    setTimeout(function(){
      t.classList.remove('is-show');
      setTimeout(function(){ t.remove(); }, 250);
    }, 2400);
  };

  function openModal(opts){
    modalTitle.textContent = opts.title || 'تأكيد';
    modalSub.textContent = opts.sub || '';
    modalIc.className = 'app-modal-ic' + (opts.danger ? ' is-danger' : '');
    modalIc.innerHTML = ICONS[opts.danger ? 'error' : 'info'];
    modalOk.textContent = opts.okText || 'تأكيد';
    modalCancel.textContent = opts.cancelText || 'إلغاء';
    modalOk.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
    modalCancel.style.display = opts.hideCancel ? 'none' : '';
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
  }
  function closeModal(v){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    if (currentResolve){ currentResolve(v); currentResolve = null; }
  }
  window.appConfirm = function(text, opts){
    opts = opts || {};
    return new Promise(function(resolve){
      currentResolve = resolve;
      openModal({ title: opts.title || 'تأكيد', sub: text, danger: opts.danger,
                  okText: opts.okText || 'تأكيد', cancelText: opts.cancelText || 'إلغاء' });
    });
  };
  modalOk.addEventListener('click', function(){ closeModal(true); });
  modal.querySelectorAll('[data-app-close]').forEach(function(el){
    el.addEventListener('click', function(){ closeModal(false); });
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal(false);
  });
})();
</script>
</body>
</html>
